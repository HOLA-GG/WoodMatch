project_id = "woodmatch-pilot"

[functions.woodmatch]
# Firebase JWTs are verified by the function, not by the Supabase Auth gateway.
verify_jwt = false

[functions.woodmatch-maintenance]
verify_jwt = true

[functions.woodmatch-dashboard]
# Dedicated verifier validates Firebase signature, issuer, audience and account revocation.
verify_jwt = false

[functions.woodmatch-admin]
# Firebase identity/account status and the private administrator UID list are verified in-handler.
verify_jwt = false
