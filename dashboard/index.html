<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WoodMatch · Administración</title><link rel="stylesheet" href="/style.css"></head><body>
<a class="skip" href="#content">Saltar al contenido</a><div class="shell"><aside><div class="brand">♣ WoodMatch</div><p class="eyebrow">ADMINISTRACIÓN</p><nav aria-label="Secciones"><button data-page="Resumen" aria-current="page">▣ Resumen</button><button data-page="Incidentes">◇ Incidentes</button><button data-page="Moderación">⚑ Moderación</button><button data-page="Usuarios">♧ Usuarios</button><button data-page="Alertas">◷ Alertas</button><button data-page="Servicios TI">▥ Servicios TI</button><button data-page="Auditoría">▤ Auditoría</button></nav><div class="aside-note">Atención y cuidado de la comunidad<br>WoodMatch</div></aside>
<main id="content"><header><div><p class="eyebrow">WOODMATCH / CENTRO DE GESTIÓN</p><h1>Panel de control</h1><p class="muted">Soporte y cuidado de nuestra comunidad.</p></div><div class="preferences"><label>Tema<select id="season" aria-label="Tema"><option value="SUMMER">Verano</option><option value="SPRING">Primavera</option><option value="AUTUMN">Otoño</option><option value="SNOW">Invierno</option></select></label><label>Apariencia<select id="appearance" aria-label="Apariencia"><option value="SYSTEM">Sistema</option><option value="LIGHT">Clara</option><option value="DARK">Oscura</option></select></label></div></header>
<section class="auth card" aria-label="Acceso"><form id="login"><label>Correo<input id="email" type="email" autocomplete="username" required></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label><button>Iniciar sesión</button></form><button id="logout" hidden>Cerrar sesión</button><p id="message" role="status" aria-live="polite">Inicia sesión para continuar.</p></section>
<form id="filters" class="filters" hidden><label>Desde<input id="from" type="date" required></label><label>Hasta<input id="to" type="date" required></label><label>Servicio<select id="service"><option value="">Todos</option></select></label><button>Actualizar</button></form>
<section id="view" aria-live="polite"></section><footer>WoodMatch · Gestión de servicios y comunidad</footer></main></div>
<dialog id="detail"><h2 id="detailTitle">Detalle</h2><div id="detailContent"></div><div class="dialog-actions"><button id="close" type="button">Cerrar</button></div></dialog><script type="module" src="/app.js"></script></body></html>
